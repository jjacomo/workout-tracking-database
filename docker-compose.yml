services:
  db:
    image: mariadb:11
    container_name: workout-tracking-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: workout_tracking_db
    ports:
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
